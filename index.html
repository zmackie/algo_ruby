<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanical Watch Movement</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #ccc;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #canvas-container canvas {
      display: block;
    }

    #title-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }

    #title-overlay h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.3);
    }

    #title-overlay p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    #info-overlay {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      line-height: 1.6;
    }

    .component-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
      backdrop-filter: blur(4px);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* lil-gui overrides for style consistency */
    .lil-gui {
      --background-color: rgba(10, 10, 20, 0.85) !important;
      --text-color: #bbc !important;
      --title-background-color: rgba(30, 30, 60, 0.9) !important;
      --widget-color: rgba(60, 60, 100, 0.6) !important;
      --hover-color: rgba(80, 80, 140, 0.6) !important;
      --focus-color: rgba(100, 100, 180, 0.8) !important;
      --number-color: #8cf !important;
      --string-color: #cf8 !important;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="title-overlay">
    <h1>Mechanical Watch Movement</h1>
    <p>Interactive simulation &middot; Drag to orbit &middot; Scroll to zoom</p>
  </div>

  <div id="info-overlay">
    Gear train &middot; Escapement &middot; Balance wheel<br>
    Adjust parameters in the panel &rarr;
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
